name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily run against the live demo API to catch regressions between commits
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL of the API under test"
        required: false
        default: "https://fakerestapi.azurewebsites.net"
      groups:
        description: "Only run these JUnit tags, comma-separated (e.g. smoke). Empty runs the full regression suite."
        required: false
        default: ""

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.base_url || 'https://fakerestapi.azurewebsites.net' }}
  ALLURE_CLI: allure-commandline@2.46.1

jobs:
  api-tests:
    name: Run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js (for the Allure CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Gating suite: every test except those tagged known-defect. A failure here fails the build.
      # Failing tests are retried once to absorb transient errors from the shared demo host.
      - name: Run regression suite
        run: >
          mvn -B -ntp test
          -Dsurefire.rerunFailingTestsCount=1
          ${{ inputs.groups && format('-Dgroups={0}', inputs.groups) || '' }}

      # Tests that document known API defects. They are expected to fail, so this step never fails the build.
      # Their results are merged into the same report under "Known API defects".
      - name: Run known-defect tests (non-blocking)
        if: ${{ always() && !inputs.groups }}
        continue-on-error: true
        run: mvn -B -ntp test -Pknown-defects

      - name: Publish test results to the run summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: API test results
          annotate_only: true
          detailed_summary: true
          include_passed: true

      - name: Generate Allure report
        if: always()
        run: |
          npx --yes "$ALLURE_CLI" generate target/allure-results --clean -o target/allure-report
          npx --yes "$ALLURE_CLI" generate target/allure-results --clean --single-file -o target/allure-report-single

      - name: Upload single-file Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-single-file
          path: target/allure-report-single/index.html
          retention-days: 30

      - name: Upload full Allure report and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-full
          path: |
            target/allure-report
            target/allure-results
            target/surefire-reports
          retention-days: 30

      # Optional: publish the report to GitHub Pages. Enable by setting the repository variable
      # PUBLISH_REPORT_TO_PAGES=true and choosing "GitHub Actions" as the Pages source.
      - name: Prepare report for GitHub Pages
        if: ${{ always() && vars.PUBLISH_REPORT_TO_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

  publish-report:
    name: Publish report to GitHub Pages
    needs: api-tests
    if: ${{ always() && vars.PUBLISH_REPORT_TO_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
